<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy Hotel · folioscopio · Un día sin madrugar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#3a362e; --paper:#f3ecdc; --ink:#1d2a3a; --cream:#efe7d6; --muted:#a59c88; --sun:#ff6fb0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--desk); color:var(--cream);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px 16px 26px; overscroll-behavior:none;
    background-image:radial-gradient(120% 80% at 50% 40%, #4a463c 0%, #36332b 60%, #26231e 100%);
  }
  header{text-align:center; line-height:1.15}
  header .t{font-family:Caveat,cursive; font-size:30px; font-weight:700; letter-spacing:.3px}
  header .s{font-size:12.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:4px}
  .book{
    position:relative; width:min(94vw,600px); aspect-ratio:480/340;
    touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
    margin:4px 0 20px;
  }
  .book:active{cursor:grabbing}
  canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    border-radius:2px 7px 7px 2px;
    box-shadow:
      1.5px 1.5px 0 #34363f, 3px 3px 0 #2b2d35, 4.5px 4.5px 0 #34363f,
      6px 6px 0 #2b2d35, 7.5px 7.5px 0 #34363f, 9px 9px 0 #25272e,
      16px 22px 34px rgba(0,0,0,.55);
  }
  .bind{
    position:absolute; left:0; top:0; bottom:0; width:6.5%;
    background:linear-gradient(90deg, rgba(29,42,58,.30), rgba(29,42,58,.10) 55%, rgba(29,42,58,0));
    border-radius:2px 0 0 2px; pointer-events:none;
  }
  .bind i{position:absolute; left:28%; width:9%; min-width:3px; height:9%; background:#8d8a84; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .bind i:first-child{top:16%} .bind i:last-child{bottom:16%}
  .sheen{
    position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:2px 7px 7px 2px;
    background:linear-gradient(100deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.55) 62%, rgba(29,42,58,.16) 78%, rgba(255,255,255,0) 100%);
  }
  .sheen.go{animation:flip .11s ease-out}
  @keyframes flip{0%{opacity:.9; transform:translateX(14%)}100%{opacity:0; transform:translateX(-30%)}}
  .thumb{
    position:absolute; right:-8%; bottom:-21%; width:19%; pointer-events:none;
    transform-origin:60% 100%; transform:rotate(-16deg); transition:transform .09s ease-out;
    filter:drop-shadow(3px 5px 6px rgba(0,0,0,.45));
  }
  .thumb.tick{transform:rotate(-23deg) translateY(-2%)}
  .meta{width:min(94vw,600px); display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .scene{font-family:Caveat,cursive; font-size:25px; font-weight:700}
  .count{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  input[type=range]{width:min(94vw,600px); accent-color:var(--sun); height:28px; margin:0}
  .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  button{
    font:inherit; font-size:15px; font-weight:600; color:var(--desk); background:var(--sun);
    border:0; border-radius:999px; padding:11px 20px; cursor:pointer;
  }
  button.ghost{background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1.5px rgba(239,231,214,.45)}
  button:focus-visible, input:focus-visible{outline:2px solid var(--cream); outline-offset:3px}
  .hint{max-width:min(92vw,520px); text-align:center; font-size:13.5px; line-height:1.45; color:var(--muted); margin:0}
  @media (prefers-reduced-motion: reduce){ .sheen.go{animation:none} .thumb{transition:none} }
</style>
</head>
<body>
  <header>
    <div class="t">Lazy Hotel · un día sin madrugar</div>
    <div class="s">by Siana Box · folioscopio · prototipo</div>
  </header>

  <div class="book" id="book" aria-label="Folioscopio. Arrastra para pasar las hojas.">
    <canvas id="c" width="960" height="680"></canvas>
    <div class="bind"><i></i><i></i></div>
    <div class="sheen" id="sheen"></div>
    <svg class="thumb" id="thumb" viewBox="0 0 120 170" aria-hidden="true">
      <path d="M30 170 C24 124 14 92 24 58 C31 32 62 26 72 50 C82 78 80 122 92 170 Z" fill="#f6f0e2" stroke="#1d2a3a" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M31 66 C35 46 60 43 66 62" fill="none" stroke="#1d2a3a" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 104 C48 101 58 101 66 104 M42 114 C50 112 58 112 65 114" fill="none" stroke="#1d2a3a" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
    </svg>
  </div>

  <div class="meta">
    <div class="scene" id="scene">Portada</div>
    <div class="count" id="count">hoja 1 de 392</div>
  </div>
  <input type="range" id="bar" min="0" max="391" value="0" step="1" aria-label="Pasar las hojas">
  <div class="row">
    <button id="play">Pasar las hojas</button>
    <button id="reset" class="ghost">Volver al principio</button>
  </div>
  <p class="hint">Arrastra el dedo sobre el librito, mueve la barra o pulsa el botón. Seis huéspedes, un equipo en pijama y ocho cosas que vender.</p>

<script>
(function(){
  var TOTAL = 392, W = 480, H = 340, GY = 310;
  var INK = '#1d1630', OUT = '#f6eee2', PAPER = '#17131f', WHITE = '#fffdf6', GOLD = '#ffc94a', BLUE = '#49d6ff', PINK = '#ff5fa8', LILA = '#b68cff', BROWN = '#b9793f';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var book = document.getElementById('book'), sheen = document.getElementById('sheen'), thumb = document.getElementById('thumb');

  var frame = 0, timer = null, R = Math.random;

  // ---------- helpers ----------
  function rng(seed){ var a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function ease(t){ t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function win(t, a, b){ return clamp((t - a) / (b - a), 0, 1); }
  function pop(g){ g = clamp(g, 0, 1); return g < 1 ? 1 + .35 * Math.sin(g * 3.14) * (1 - g) - (1 - g) * .6 : 1; }

  function seg(x1, y1, x2, y2){
    var d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(d / 16)), p = [];
    for (var i = 0; i <= n; i++) p.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
    return p;
  }
  function poly(pts){
    var out = [];
    for (var i = 0; i < pts.length - 1; i++){
      var s = seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
      if (i) s.shift();
      out = out.concat(s);
    }
    return out;
  }
  function arc(cx, cy, r, a0, a1){
    var n = Math.max(8, Math.round(Math.abs(a1 - a0) * r / 5)), p = [];
    for (var i = 0; i <= n; i++){ var a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    return p;
  }
  function ell(cx, cy, rx, ry, a0, a1){ var p = [], n = 26; a0 = a0 == null ? 0 : a0; a1 = a1 == null ? 6.4 : a1; for (var i = 0; i <= n; i++){ var a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
  function stroke(pts, o){
    o = o || {};
    var jit = o.jit == null ? 0.6 : o.jit;
    ctx.save();
    ctx.globalAlpha *= o.a == null ? 1 : o.a;
    ctx.strokeStyle = o.c || OUT; ctx.lineWidth = o.w || 1.35; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++){
      var x = pts[i][0] + j(jit), y = pts[i][1] + j(jit);
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  }
  function line(x1, y1, x2, y2, o){ stroke(seg(x1, y1, x2, y2), o); }
  function box(x, y, w, h){ return poly([[x, y + h], [x, y], [x + w, y], [x + w, y + h], [x, y + h]]); }
  function fillPoly(pts, col, al){ ctx.save(); ctx.globalAlpha *= al == null ? 1 : al; ctx.fillStyle = col; ctx.beginPath(); pts.forEach(function(P, q){ if (q) ctx.lineTo(P[0], P[1]); else ctx.moveTo(P[0], P[1]); }); ctx.closePath(); ctx.fill(); ctx.restore(); }
  function disc(x, y, r, col, al){ ctx.save(); ctx.globalAlpha *= al == null ? 1 : al; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fill(); ctx.restore(); }
  function setFont(size, bold){ ctx.font = (bold ? '700 ' : '500 ') + size + 'px Caveat, "Segoe Print", "Comic Sans MS", cursive'; }
  function hand(txt, x, y, size, o){
    o = o || {};
    ctx.save(); ctx.globalAlpha *= o.a == null ? 1 : o.a; ctx.fillStyle = o.c || INK;
    setFont(size, o.bold);
    ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
    ctx.translate(x + j(.4), y + j(.4)); ctx.rotate((o.rot || 0) + j(.006)); ctx.fillText(txt, 0, 0); ctx.restore();
  }
  function tw(txt, size, bold){ ctx.save(); setFont(size, bold); var w = ctx.measureText(txt).width; ctx.restore(); return w; }
  function sparkle(x, y, r, col, al){ for (var q = 0; q < 4; q++){ var a = q * .785; line(x - Math.cos(a) * r, y - Math.sin(a) * r, x + Math.cos(a) * r, y + Math.sin(a) * r, {c: col || GOLD, w: q % 2 ? .9 : 1.5, a: al, jit: .2}); } }

  // paper grain, made once
  var grain = document.createElement('canvas'); grain.width = 260; grain.height = 190;
  (function(){
    var g = grain.getContext('2d'), r = rng(4242);
    for (var i = 0; i < 5200; i++){
      g.fillStyle = r() > .5 ? 'rgba(120,96,58,' + (r() * .10).toFixed(3) + ')' : 'rgba(255,255,255,' + (r() * .16).toFixed(3) + ')';
      g.fillRect(r() * 260, r() * 190, 1 + r() * 1.6, 1 + r() * 1.2);
    }
    for (var k = 0; k < 26; k++){
      g.strokeStyle = 'rgba(110,88,52,' + (.05 + r() * .07).toFixed(3) + ')'; g.lineWidth = .6;
      var x = r() * 260, y = r() * 190; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 22, y + (r() - .5) * 10); g.stroke();
    }
  })();
  function paperBase(){ ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); }
  function paperGrain(f){
    ctx.save(); ctx.globalAlpha = .3;
    ctx.drawImage(grain, -((f * 37) % 50), -((f * 23) % 36), 560, 410);
    ctx.restore();

  }

  Object.keys(SRC).forEach(function(k){ var im = new Image(); im.onload = function(){ draw(); }; im.src = SRC[k]; IMG[k] = im; });
  function ok(im){ return im && im.complete && im.naturalWidth; }
  function photo(name, t, al){
    var im = IMG[name]; if (!ok(im)) return;
    var z = 1.03 + .035 * t, w = W * z, h = H * z;
    ctx.save(); ctx.globalAlpha = al == null ? .92 : al;
    ctx.drawImage(im, (W - w) / 2 + j(.5), (H - h) * .6 + j(.5), w, h);
    ctx.restore();

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(23,19,31,.42)'); g.addColorStop(.3, 'rgba(23,19,31,.12)'); g.addColorStop(.7, 'rgba(23,19,31,.18)'); g.addColorStop(1, 'rgba(23,19,31,.6)');

  }
  function archMark(cx, by, w, col, lw){ // the brand arch: three nested arches
    for (var k = 0; k < 3; k++){
      var r = w / 2 * (1 - k * .27), hh = w * .62 * (1 - k * .2);
      stroke(seg(cx - r, by, cx - r, by - hh).concat(arc(cx, by - hh, r, Math.PI, 2 * Math.PI), seg(cx + r, by - hh, cx + r, by)), {c: col || GOLD, w: lw || 1.4, jit: .25});

    fillPoly([[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]], WHITE, .96);

    if (ok(IMG.room)){ ctx.save(); ctx.globalAlpha = .35; ctx.drawImage(IMG.room, 0, 0, W, H); ctx.restore(); ctx.fillStyle = 'rgba(23,19,31,.55)'; ctx.fillRect(0, 0, W, H); }
    paperGrain(f);
    neon(box(40, 16, 424, 308), PINK, 1.6, .8);
    bear(250, 128, {s: 1.05, d: 1, noShadow: true, back: [-19, -40 + Math.sin(f) * 3], front: [19, -40 - Math.sin(f) * 3]});
    neonText('lazy hotel', 250, 192, 58, PINK, {rot: -.03});
    hand('where comfort meets cuddles', 250, 216, 16, {a: .8, c: OUT});
    hand('Un día sin madrugar', 250, 256, 27, {bold: true, c: BLUE});
    hand('seis huéspedes · ocho cosas que vender', 250, 280, 16, {a: .85, c: OUT});
    hand('pasa las hojas  →', 250, H - 22, 15, {a: .6, c: OUT});
  }

  var SFN = [sOpen, sDeseo, sBelleza, sSeguridad, sEsperanza, sSalud, sMiedo, sEstatus, sPertenencia, sEnd];
  var SCN = ['Portada', '11:00 · El hotel se despereza', '1 · Deseo · la pareja con prisa', '2 · Belleza · la de la cara de lunes', '3 · Seguridad · el empresario', '4 · Esperanza · la estudiante', '5 · Salud · el que no duerme', '6 · Miedo · la que no para', '7 · Estatus · el empresario, sin móvil', '8 · Pertenencia · la que vino sola', 'Cierre'];
  var SC = [6, 36, 80, 124, 168, 212, 256, 300, 344, 372];
  function sceneName(f){ if (f < SC[0]) return SCN[0]; for (var i = 0; i < SC.length; i++) if (f < (SC[i + 1] || TOTAL)) return SCN[i + 1]; return SCN[SCN.length - 1]; }
  function page(e){
    paperBase();
    var i = 0; while (i < SFN.length - 1 && e >= SC[i + 1]) i++;
    var end = i + 1 < SC.length ? SC[i + 1] : TOTAL;
    var t = (e - SC[i]) / (end - SC[i] - 1);
    SFN[i](clamp(t, 0, 1), e);
    paperGrain(e);
    hand(String(e - 5), 150, H - 8, 13, {a: .6, align: 'left', c: OUT});
  }

  function draw(){
    var rect = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    var pw = Math.max(240, Math.round(rect.width * dpr)), ph = Math.round(pw * H / W);
    if (cv.width !== pw || cv.height !== ph){ cv.width = pw; cv.height = ph; }
    ctx.setTransform(pw / W, 0, 0, ph / H, 0, 0);
    R = rng(frame * 7919 + 13);
    if (frame < 6) cover(frame); else page(frame);
  }

  // ---------- controls ----------
  function setFrame(n, quiet){
    n = clamp(Math.round(n), 0, TOTAL - 1);
    if (n === frame && !quiet) return;
    frame = n; draw();
    bar.value = n; sceneEl.textContent = sceneName(n); countEl.textContent = 'hoja ' + (n + 1) + ' de ' + TOTAL;
    if (!quiet){
      sheen.classList.remove('go'); void sheen.offsetWidth; sheen.classList.add('go');
      thumb.classList.add('tick'); clearTimeout(setFrame._t); setFrame._t = setTimeout(function(){ thumb.classList.remove('tick'); }, 70);
    }
  }
  function stop(){ if (timer){ clearInterval(timer); timer = null; } playBtn.textContent = frame >= TOTAL - 1 ? 'Ver otra vez' : 'Pasar las hojas'; }
  function play(){
    if (timer){ stop(); return; }
    if (frame >= TOTAL - 1) setFrame(0);
    playBtn.textContent = 'Parar';
    timer = setInterval(function(){ if (frame >= TOTAL - 1){ stop(); return; } setFrame(frame + 1); }, 150);
  }
  playBtn.addEventListener('click', play);
  resetBtn.addEventListener('click', function(){ stop(); setFrame(0); playBtn.textContent = 'Pasar las hojas'; });
  bar.addEventListener('input', function(){ stop(); setFrame(+bar.value); });

  var drag = null;
  book.addEventListener('pointerdown', function(e){ stop(); drag = {x: e.clientX, y: e.clientY, f: frame}; try{ book.setPointerCapture(e.pointerId); }catch(_){} });
  book.addEventListener('pointermove', function(e){ if (!drag) return; var d = (drag.y - e.clientY) + (drag.x - e.clientX); setFrame(drag.f + d / 7); });
  function end(){ drag = null; }
  book.addEventListener('pointerup', end); book.addEventListener('pointercancel', end);

  var acc = 0;
  window.addEventListener('wheel', function(e){
    e.preventDefault(); stop(); acc += e.deltaY;
    var steps = (acc / 26) | 0; if (steps){ acc -= steps * 26; setFrame(frame + steps); }
  }, {passive: false});
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ stop(); setFrame(frame + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ stop(); setFrame(frame - 1); }
  });
  window.addEventListener('resize', draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  window.__setFrame = function(n){ setFrame(n, true); };
  setFrame(0, true);
})();
</script>
