<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand By Me · folioscopio 1 · Así nace un hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#22211e; --paper:#f3ecdc; --ink:#1d2a3a; --cream:#efe7d6; --muted:#a59c88; --sun:#e2a93b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--desk); color:var(--cream);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px 16px 26px; overscroll-behavior:none;
    background-image:radial-gradient(120% 80% at 50% 40%, #2e2c27 0%, #22211e 60%, #191815 100%);
  }
  header{text-align:center; line-height:1.15}
  header .t{font-family:Caveat,cursive; font-size:30px; font-weight:700; letter-spacing:.3px}
  header .s{font-size:12.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:4px}
  .book{
    position:relative; width:min(94vw,600px); aspect-ratio:480/340;
    touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
    margin:4px 0 20px;
  }
  .book:active{cursor:grabbing}
  canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    border-radius:2px 7px 7px 2px;
    box-shadow:
      1.5px 1.5px 0 #e9e0cb, 3px 3px 0 #dfd5be, 4.5px 4.5px 0 #d6cbb2,
      6px 6px 0 #ccc0a6, 7.5px 7.5px 0 #c2b69b, 9px 9px 0 #b8ab90,
      16px 22px 34px rgba(0,0,0,.55);
  }
  .bind{
    position:absolute; left:0; top:0; bottom:0; width:6.5%;
    background:linear-gradient(90deg, rgba(29,42,58,.30), rgba(29,42,58,.10) 55%, rgba(29,42,58,0));
    border-radius:2px 0 0 2px; pointer-events:none;
  }
  .bind i{position:absolute; left:28%; width:9%; min-width:3px; height:9%; background:#8d8a84; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .bind i:first-child{top:16%} .bind i:last-child{bottom:16%}
  .sheen{
    position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:2px 7px 7px 2px;
    background:linear-gradient(100deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.55) 62%, rgba(29,42,58,.16) 78%, rgba(255,255,255,0) 100%);
  }
  .sheen.go{animation:flip .11s ease-out}
  @keyframes flip{0%{opacity:.9; transform:translateX(14%)}100%{opacity:0; transform:translateX(-30%)}}
  .thumb{
    position:absolute; right:-8%; bottom:-21%; width:19%; pointer-events:none;
    transform-origin:60% 100%; transform:rotate(-16deg); transition:transform .09s ease-out;
    filter:drop-shadow(3px 5px 6px rgba(0,0,0,.45));
  }
  .thumb.tick{transform:rotate(-23deg) translateY(-2%)}
  .meta{width:min(94vw,600px); display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .scene{font-family:Caveat,cursive; font-size:25px; font-weight:700}
  .count{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  input[type=range]{width:min(94vw,600px); accent-color:var(--sun); height:28px; margin:0}
  .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  button{
    font:inherit; font-size:15px; font-weight:600; color:var(--desk); background:var(--sun);
    border:0; border-radius:999px; padding:11px 20px; cursor:pointer;
  }
  button.ghost{background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1.5px rgba(239,231,214,.45)}
  button:focus-visible, input:focus-visible{outline:2px solid var(--cream); outline-offset:3px}
  .hint{max-width:min(92vw,520px); text-align:center; font-size:13.5px; line-height:1.45; color:var(--muted); margin:0}
  @media (prefers-reduced-motion: reduce){ .sheen.go{animation:none} .thumb{transition:none} }
</style>
</head>
<body>
  <header>
    <div class="t">Así nace un hotel</div>
    <div class="s">Stand By Me · folioscopio 1 · prototipo</div>
  </header>

  <div class="book" id="book" aria-label="Folioscopio. Arrastra para pasar las hojas.">
    <canvas id="c" width="960" height="680"></canvas>
    <div class="bind"><i></i><i></i></div>
    <div class="sheen" id="sheen"></div>
    <svg class="thumb" id="thumb" viewBox="0 0 120 170" aria-hidden="true">
      <path d="M30 170 C24 124 14 92 24 58 C31 32 62 26 72 50 C82 78 80 122 92 170 Z" fill="#f6f0e2" stroke="#1d2a3a" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M31 66 C35 46 60 43 66 62" fill="none" stroke="#1d2a3a" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 104 C48 101 58 101 66 104 M42 114 C50 112 58 112 65 114" fill="none" stroke="#1d2a3a" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
    </svg>
  </div>

  <div class="meta">
    <div class="scene" id="scene">Portada</div>
    <div class="count" id="count">hoja 1 de 218</div>
  </div>
  <input type="range" id="bar" min="0" max="217" value="0" step="1" aria-label="Pasar las hojas">
  <div class="row">
    <button id="play">Pasar las hojas</button>
    <button id="reset" class="ghost">Volver al principio</button>
  </div>
  <p class="hint">Arrastra el dedo sobre el librito, mueve la barra o pulsa el botón. En la web real, las hojas pasarán con el scroll.</p>

  // subdivide a straight line so the hand wobble shows along it
  function seg(x1, y1, x2, y2){
    var d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(d / 16)), p = [];
    for (var i = 0; i <= n; i++) p.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);

  }
  function poly(pts){ // subdivide every edge of a polyline
    var out = [];
    for (var i = 0; i < pts.length - 1; i++){
      var s = seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
      if (i) s.shift();
      out = out.concat(s);
    }
    return out;
  }
  function arc(cx, cy, r, a0, a1){
    var n = Math.max(8, Math.round(Math.abs(a1 - a0) * r / 5)), p = [];
    for (var i = 0; i <= n; i++){ var a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }

  }
  function stroke(pts, o){
    o = o || {};
    var jit = (o.jit == null ? 0.7 : o.jit) * KJ;
    ctx.save();
    ctx.globalAlpha *= o.a == null ? 1 : o.a;

    }
    ctx.stroke(); ctx.restore();
  }

  function dot(x, y, r){ ctx.save(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x + j(.3), y + j(.3), r || 1.2, 0, 6.3); ctx.fill(); ctx.restore(); }
  function hand(txt, x, y, size, o){
    o = o || {};
    ctx.save(); ctx.globalAlpha = o.a == null ? 1 : o.a; ctx.fillStyle = o.c || INK;
    ctx.font = (o.bold ? '700 ' : '500 ') + size + 'px Caveat, "Segoe Print", "Comic Sans MS", cursive';
    ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
    ctx.translate(x + j(.5), y + j(.5)); ctx.rotate((o.rot || 0) + j(.008)); ctx.fillText(txt, 0, 0); ctx.restore();
  }

  var grain = document.createElement('canvas'); grain.width = 260; grain.height = 190;
  (function(){
    var g = grain.getContext('2d'), r = rng(4242);
    for (var i = 0; i < 5200; i++){

      g.fillRect(r() * 260, r() * 190, 1 + r() * 1.6, 1 + r() * 1.2);

    }
