<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand By Me · folioscopio 2 · Así crece el grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:#22211e; --paper:#f3ecdc; --ink:#1d2a3a; --cream:#efe7d6; --muted:#a59c88; --sun:#e2a93b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--desk); color:var(--cream);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px 16px 26px; overscroll-behavior:none;
    background-image:radial-gradient(120% 80% at 50% 40%, #2e2c27 0%, #22211e 60%, #191815 100%);
  }
  header{text-align:center; line-height:1.15}
  header .t{font-family:Caveat,cursive; font-size:30px; font-weight:700; letter-spacing:.3px}
  header .s{font-size:12.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:4px}
  .book{
    position:relative; width:min(94vw,600px); aspect-ratio:480/340;
    touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
    margin:4px 0 20px;
  }
  .book:active{cursor:grabbing}
  canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    border-radius:2px 7px 7px 2px;
    box-shadow:
      1.5px 1.5px 0 #e9e0cb, 3px 3px 0 #dfd5be, 4.5px 4.5px 0 #d6cbb2,
      6px 6px 0 #ccc0a6, 7.5px 7.5px 0 #c2b69b, 9px 9px 0 #b8ab90,
      16px 22px 34px rgba(0,0,0,.55);
  }
  .bind{
    position:absolute; left:0; top:0; bottom:0; width:6.5%;
    background:linear-gradient(90deg, rgba(29,42,58,.30), rgba(29,42,58,.10) 55%, rgba(29,42,58,0));
    border-radius:2px 0 0 2px; pointer-events:none;
  }
  .bind i{position:absolute; left:28%; width:9%; min-width:3px; height:9%; background:#8d8a84; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .bind i:first-child{top:16%} .bind i:last-child{bottom:16%}
  .sheen{
    position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:2px 7px 7px 2px;
    background:linear-gradient(100deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.55) 62%, rgba(29,42,58,.16) 78%, rgba(255,255,255,0) 100%);
  }
  .sheen.go{animation:flip .11s ease-out}
  @keyframes flip{0%{opacity:.9; transform:translateX(14%)}100%{opacity:0; transform:translateX(-30%)}}
  .thumb{
    position:absolute; right:-8%; bottom:-21%; width:19%; pointer-events:none;
    transform-origin:60% 100%; transform:rotate(-16deg); transition:transform .09s ease-out;
    filter:drop-shadow(3px 5px 6px rgba(0,0,0,.45));
  }
  .thumb.tick{transform:rotate(-23deg) translateY(-2%)}
  .meta{width:min(94vw,600px); display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .scene{font-family:Caveat,cursive; font-size:25px; font-weight:700}
  .count{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  input[type=range]{width:min(94vw,600px); accent-color:var(--sun); height:28px; margin:0}
  .row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  button{
    font:inherit; font-size:15px; font-weight:600; color:var(--desk); background:var(--sun);
    border:0; border-radius:999px; padding:11px 20px; cursor:pointer;
  }
  button.ghost{background:transparent; color:var(--cream); box-shadow:inset 0 0 0 1.5px rgba(239,231,214,.45)}
  button:focus-visible, input:focus-visible{outline:2px solid var(--cream); outline-offset:3px}
  .hint{max-width:min(92vw,520px); text-align:center; font-size:13.5px; line-height:1.45; color:var(--muted); margin:0}
  @media (prefers-reduced-motion: reduce){ .sheen.go{animation:none} .thumb{transition:none} }
</style>
</head>
<body>
  <header>
    <div class="t">Así crece el grupo</div>
    <div class="s">Stand By Me · folioscopio 2 · prototipo</div>
  </header>

  <div class="book" id="book" aria-label="Folioscopio. Arrastra para pasar las hojas.">
    <canvas id="c" width="960" height="680"></canvas>
    <div class="bind"><i></i><i></i></div>
    <div class="sheen" id="sheen"></div>
    <svg class="thumb" id="thumb" viewBox="0 0 120 170" aria-hidden="true">
      <path d="M30 170 C24 124 14 92 24 58 C31 32 62 26 72 50 C82 78 80 122 92 170 Z" fill="#f6f0e2" stroke="#1d2a3a" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M31 66 C35 46 60 43 66 62" fill="none" stroke="#1d2a3a" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 104 C48 101 58 101 66 104 M42 114 C50 112 58 112 65 114" fill="none" stroke="#1d2a3a" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
    </svg>
  </div>

  <div class="meta">
    <div class="scene" id="scene">Portada</div>
    <div class="count" id="count">hoja 1 de 156</div>
  </div>
  <input type="range" id="bar" min="0" max="155" value="0" step="1" aria-label="Pasar las hojas">
  <div class="row">
    <button id="play">Pasar las hojas</button>
    <button id="reset" class="ghost">Volver al principio</button>
  </div>
  <p class="hint">Arrastra el dedo sobre el librito, mueve la barra o pulsa el botón. En la web real, las hojas pasarán con el scroll.</p>

<script>
(function(){
  var TOTAL = 156, KW = 1, KJ = 1, W = 480, H = 340, G = 262;
  var INK = '#1d2a3a', SUN = '#e2a93b', GREEN = '#6f9a63', BLUE = '#5f9ec4';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var book = document.getElementById('book'), sheen = document.getElementById('sheen'), thumb = document.getElementById('thumb');
  var bar = document.getElementById('bar'), sceneEl = document.getElementById('scene'), countEl = document.getElementById('count');
  var playBtn = document.getElementById('play'), resetBtn = document.getElementById('reset');
  var frame = 0, timer = null, R = Math.random;

  // ---------- helpers ----------
  function rng(seed){ var a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function j(a){ return (R() - 0.5) * 2 * a; }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t){ return a + (b - a) * clamp(t, 0, 1); }
  function ease(t){ t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  // subdivide a straight line so the hand wobble shows along it
  function seg(x1, y1, x2, y2){
    var d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(d / 16)), p = [];
    for (var i = 0; i <= n; i++) p.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
    return p;
  }
  function poly(pts){ // subdivide every edge of a polyline
    var out = [];
    for (var i = 0; i < pts.length - 1; i++){
      var s = seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
      if (i) s.shift();
      out = out.concat(s);
    }
    return out;
  }
  function arc(cx, cy, r, a0, a1){
    var n = Math.max(8, Math.round(Math.abs(a1 - a0) * r / 5)), p = [];
    for (var i = 0; i <= n; i++){ var a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    return p;
  }
  function stroke(pts, o){
    o = o || {};
    var jit = (o.jit == null ? 0.7 : o.jit) * KJ;
    ctx.save();
    ctx.globalAlpha *= o.a == null ? 1 : o.a;
    ctx.strokeStyle = o.c || INK; ctx.lineWidth = (o.w || 1.35) * KW; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++){
      var x = pts[i][0] + j(jit), y = pts[i][1] + j(jit);
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  }
  function line(x1, y1, x2, y2, o){ stroke(seg(x1, y1, x2, y2), o); }
  function ring(cx, cy, r, o){ var s = R() * 6.28; stroke(arc(cx, cy, r, s, s + 6.28 + 0.3), o); }
  function dot(x, y, r){ ctx.save(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x + j(.3), y + j(.3), r || 1.2, 0, 6.3); ctx.fill(); ctx.restore(); }
  function hand(txt, x, y, size, o){
    o = o || {};
    ctx.save(); ctx.globalAlpha = o.a == null ? 1 : o.a; ctx.fillStyle = o.c || INK;
    ctx.font = (o.bold ? '700 ' : '500 ') + size + 'px Caveat, "Segoe Print", "Comic Sans MS", cursive';
    ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
    ctx.translate(x + j(.5), y + j(.5)); ctx.rotate((o.rot || 0) + j(.008)); ctx.fillText(txt, 0, 0); ctx.restore();
  }

  // paper grain, made once
  var grain = document.createElement('canvas'); grain.width = 260; grain.height = 190;
  (function(){
    var g = grain.getContext('2d'), r = rng(4242);
    for (var i = 0; i < 5200; i++){
      g.fillStyle = r() > .5 ? 'rgba(120,96,58,' + (r() * .10).toFixed(3) + ')' : 'rgba(255,255,255,' + (r() * .16).toFixed(3) + ')';
      g.fillRect(r() * 260, r() * 190, 1 + r() * 1.6, 1 + r() * 1.2);
    }
    for (var k = 0; k < 26; k++){ // a few paper fibres
      g.strokeStyle = 'rgba(110,88,52,' + (.05 + r() * .07).toFixed(3) + ')'; g.lineWidth = .6;
      var x = r() * 260, y = r() * 190; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 22, y + (r() - .5) * 10); g.stroke();
    }
  })();

  function paper(f, base){
    ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = .9;
    ctx.drawImage(grain, -((f * 37) % 50), -((f * 23) % 36), 560, 410);
    ctx.restore();
    var g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(60,45,20,.10)'); g.addColorStop(.12, 'rgba(60,45,20,0)'); g.addColorStop(.9, 'rgba(60,45,20,0)'); g.addColorStop(1, 'rgba(60,45,20,.07)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // ---------- timeline ----------
  function worldAt(f){ // how far the street has scrolled
    if (f <= 6) return 0;
    var walk = Math.min(f, 45) - 6, w = walk * 9;
    var dec = [6, 4, 2, 1];
    for (var k = 46; k <= Math.min(f, 49); k++) w += dec[k - 46];
    return w;
  }
  function sceneName(f){ return f < 6 ? 'Portada' : f < 20 ? '1 · El explorador' : f < 66 ? '2 · El conquistador' : f < 106 ? '3 · La ciudad' : '4 · El imperio'; }

  // ---------- drawings ----------
  function sun(cx, cy, r, turn, g){
    g = g == null ? 1 : g;
    ctx.save(); ctx.globalAlpha = .38; ctx.strokeStyle = SUN; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.3); ctx.stroke(); ctx.restore();
    ring(cx, cy, r, {w: 1.6});
    ring(cx, cy, r * .52, {w: 1.1});
    for (var i = 0; i < 20; i++){
      var a = turn + i * 6.283 / 20, r1 = r * 1.22, r2 = r1 + (r * (i % 2 ? 1.62 : 1.92) - r1) * g;
      if (g <= 0) continue;
      line(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1, cx + Math.cos(a) * r2, cy + Math.sin(a) * r2, {w: 1.25, jit: .5});
    }
  }

  function cover(f){
    paper(f, '#cdb58a');
    line(30, 22, 30, H - 22, {a: .35, w: 1});
    sun(W / 2 + 6, 132, 34, f * 0.11);
    hand('stand by me', W / 2 + 6, 246, 44, {bold: true});
    hand('libro 2 · así crece el grupo', W / 2 + 6, 276, 22, {a: .75});
    hand('pasa las hojas  →', W / 2 + 6, H - 24, 17, {a: .6});
  }

  function ground(world){
    stroke(seg(-10, G, W + 10, G), {w: 1.5, jit: .55});
    for (var wx = 0; wx < 2000; wx += 47){
      var x = wx - world;
      if (x < -20 || x > W + 20) continue;
      var k = (wx / 47) % 3;
      if (k === 0) line(x, G + 7, x + 9, G + 7, {a: .55, w: 1, jit: .4});
      else if (k === 1) stroke(arc(x, G + 5, 2.6, 3.3, 6.1), {a: .6, w: 1, jit: .3});
      else line(x, G + 11, x + 5, G + 10, {a: .4, w: 1, jit: .4});
    }
  }

  function skyline(world){ // far, faint, moves slowly
    var bx = [[40, 46, 70], [96, 34, 104], [140, 52, 58], [214, 40, 88], [270, 60, 66], [352, 38, 112], [404, 56, 74], [476, 44, 92], [540, 50, 62], [610, 40, 100]];
    for (var i = 0; i < bx.length; i++){
      var x = bx[i][0] - world * .32, w = bx[i][1], h = bx[i][2];
      if (x + w < -10 || x > W + 10) continue;
      stroke(poly([[x, G], [x, G - h], [x + w, G - h], [x + w, G]]), {a: .26, w: 1, jit: .5});
      for (var r = 0; r < 3; r++) line(x + 7, G - h + 12 + r * 16, x + w - 7, G - h + 12 + r * 16, {a: .14, w: 1, jit: .4});
    }
  }

  function lamp(x){
    if (x < -40 || x > W + 40) return;
    line(x, G, x, G - 128, {w: 1.4});
    line(x - 4, G, x + 4, G, {w: 1.4});
    stroke(arc(x + 14, G - 128, 14, 3.14, 4.9), {w: 1.3});
    stroke(poly([[x + 12, G - 141], [x + 22, G - 141], [x + 25, G - 128], [x + 9, G - 128], [x + 12, G - 141]]), {w: 1.2, jit: .4});
  }
  function tree(x, green){
    if (x < -60 || x > W + 60) return;
    if (green){ ctx.save(); ctx.globalAlpha = .3; ctx.fillStyle = GREEN; [[x - 13, G - 82, 21], [x + 15, G - 86, 23], [x + 2, G - 106, 20]].forEach(function(c){ ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, 6.3); ctx.fill(); }); ctx.restore(); }
    line(x, G, x + 1, G - 62, {w: 1.5});
    line(x + 1, G - 44, x + 13, G - 60, {w: 1.1});
    ring(x - 13, G - 82, 21, {w: 1.2, a: .9});
    ring(x + 15, G - 86, 23, {w: 1.2, a: .9});
    ring(x + 2, G - 106, 20, {w: 1.2, a: .9});
  }

  function hoop(x, r, ang, cyo){
    var cy = cyo == null ? G - r : cyo;
    ctx.save(); ctx.globalAlpha = .36; ctx.strokeStyle = SUN; ctx.lineWidth = 5.5; ctx.beginPath(); ctx.arc(x, cy, r, 0, 6.3); ctx.stroke(); ctx.restore();
    ring(x, cy, r, {w: 1.8, jit: .6});
    ring(x, cy, r - 3.2, {w: .9, jit: .5, a: .7});
    // a small knot, so you can see it turning
    var kx = x + Math.cos(ang) * r, ky = cy + Math.sin(ang) * r;
    line(kx - 3, ky - 3, kx + 3, ky + 3, {w: 1.6, jit: .3});
    line(kx + 3, ky - 3, kx - 3, ky + 3, {w: 1.6, jit: .3});
    return {x: x, y: cy};
  }

  function pencil(hx, hy, tx, ty, alpha){
    var d = Math.hypot(tx - hx, ty - hy) || 1, ux = (tx - hx) / d, uy = (ty - hy) / d, nx = -uy, ny = ux, hw = 2.3;
    var bx = hx - ux * 7, by = hy - uy * 7, ex = tx - ux * 9, ey = ty - uy * 9;
    ctx.save(); ctx.globalAlpha = .42 * alpha; ctx.fillStyle = SUN;
    ctx.beginPath(); ctx.moveTo(bx + nx * hw, by + ny * hw); ctx.lineTo(ex + nx * hw, ey + ny * hw); ctx.lineTo(ex - nx * hw, ey - ny * hw); ctx.lineTo(bx - nx * hw, by - ny * hw); ctx.closePath(); ctx.fill(); ctx.restore();
    var o = {w: 1.15, jit: .35, a: alpha};
    line(bx + nx * hw, by + ny * hw, ex + nx * hw, ey + ny * hw, o);
    line(bx - nx * hw, by - ny * hw, ex - nx * hw, ey - ny * hw, o);
    line(bx + nx * hw, by + ny * hw, bx - nx * hw, by - ny * hw, o);
    line(bx + ux * 4 + nx * hw, by + uy * 4 + ny * hw, bx + ux * 4 - nx * hw, by + uy * 4 - ny * hw, o);
    stroke([[ex + nx * hw, ey + ny * hw], [tx, ty], [ex - nx * hw, ey - ny * hw]], o);
    line(ex + nx * hw, ey + ny * hw, ex - nx * hw, ey - ny * hw, {w: 1, jit: .3, a: alpha * .8});
  }

  // the boy. phase drives the walk; aim is where his front hand points
  function boy(x, phase, moving, aim, glasses, pop, cap){
    var bob = moving ? -Math.abs(Math.sin(phase)) * 1.8 : 0;
    var hipY = G - 35 + bob, shY = G - 61 + bob, hdY = G - 74 + bob, hdX = x + 2;
    // legs
    var s = moving ? Math.sin(phase) : 0.28, c = moving ? Math.cos(phase) : 0;
    var f1x = x + s * 13, f1y = G - Math.max(0, c) * 5, f2x = x - s * 13, f2y = G - Math.max(0, -c) * 5;
    stroke([[x, hipY], [x + s * 8 + 3, hipY + 17], [f1x, f1y], [f1x + 6, f1y]], {w: 1.5});
    stroke([[x, hipY], [x - s * 8 + 3, hipY + 17], [f2x, f2y], [f2x + 6, f2y]], {w: 1.5});
    // shorts and shirt
    stroke(poly([[x - 7, hipY - 3], [x + 7, hipY - 3], [x + 9, hipY + 9], [x + 1, hipY + 8], [x, hipY + 3], [x - 2, hipY + 8], [x - 9, hipY + 9], [x - 7, hipY - 3]]), {w: 1.25, jit: .45});
    stroke(poly([[x - 6, hipY - 3], [x - 5, shY + 1], [x + 6, shY + 1], [x + 6, hipY - 3]]), {w: 1.3, jit: .5});
    line(x - 1, shY + 1, x + 2, shY - 3, {w: 1.1, jit: .3});
    // back arm
    var ba = moving ? -s * 9 : -4;
    stroke([[x - 3, shY + 3], [x - 7 + ba * .5, shY + 14], [x - 5 + ba, shY + 24]], {w: 1.35});
    // front arm to the hand
    var hx, hy;
    if (aim){
      var d = Math.hypot(aim[0] - (x + 4), aim[1] - (shY + 3)) || 1;
      hx = x + 4 + (aim[0] - (x + 4)) / d * 23; hy = shY + 3 + (aim[1] - (shY + 3)) / d * 23;
      stroke([[x + 4, shY + 3], [(x + 4 + hx) / 2 + 2, (shY + 3 + hy) / 2 + 3], [hx, hy]], {w: 1.4});
    } else {
      hx = x + 21; hy = shY + 14 + (moving ? Math.sin(phase * 2) * 1.2 : 0);
      stroke([[x + 4, shY + 3], [x + 11, shY + 13], [hx, hy]], {w: 1.4});
    }
    // head
    ring(hdX, hdY, 11, {w: 1.5, jit: .5});
    stroke([[hdX + 10, hdY - 1], [hdX + 13.5, hdY + 2], [hdX + 10, hdY + 3.5]], {w: 1.2, jit: .3});
    stroke(arc(hdX + 5, hdY + 5.5, 3.2, .3, 1.9), {w: 1.1, jit: .25});
    stroke(arc(hdX - 1, hdY - 2.5, 12.2, 3.35, 5.75), {w: 1.5, jit: .4});
    stroke(arc(hdX - 1.5, hdY - 1.5, 10.2, 3.6, 5.3), {w: 1.1, jit: .4, a: .8});
    stroke([[hdX + 3, hdY - 11.5], [hdX + 10.5, hdY - 15], [hdX + 9.5, hdY - 8.5]], {w: 1.4, jit: .35});
    stroke([[hdX - 11, hdY - 1], [hdX - 13.5, hdY + 3]], {w: 1.2, jit: .3});
    stroke(arc(hdX - 5, hdY + 1, 2.4, 1.2, 4.6), {w: 1, jit: .2});
    if (glasses){
      ring(hdX + 6, hdY - 1, 4.4, {w: 1.5, jit: .3});
      line(hdX + 1.6, hdY - 1.5, hdX - 7, hdY - 2.5, {w: 1.2, jit: .3});
      dot(hdX + 6.5, hdY - 1, 1);
      if (pop) for (var i = 0; i < 4; i++){ var a = -2.5 + i * .55; line(hdX + 4 + Math.cos(a) * 17, hdY - 2 + Math.sin(a) * 17, hdX + 4 + Math.cos(a) * 23, hdY - 2 + Math.sin(a) * 23, {w: 1.1, jit: .3, a: .8}); }
    } else dot(hdX + 6, hdY - 1.5, 1.25);
    if (cap >= 5){ // an explorer's hat

      if (e < 10) cane(b.hx, b.hy, b.hx + 8, b.hy - 24, 1);
      else if (e < 20) spyglass(bx + 14, G - 76, e);
      else {
        var tx = b.hx + 4, ty = b.hy - 46;
        if (aim && (e >= 34 && e < 37 || e >= 60 && e < 63)){ var d = Math.hypot(aim[0] - b.hx, aim[1] - b.hy) || 1; tx = b.hx + (aim[0] - b.hx) / d * 34; ty = b.hy + (aim[1] - b.hy) / d * 34; }
        flag(b.hx, b.hy, tx, ty, e);
      }
    };
    if (z < .6){ // keep him readable as the view widens
      var kz = Math.min(2.6, .6 / z);
      ctx.save(); ctx.translate(bx, G); ctx.scale(kz, kz); ctx.translate(-bx, -G); KW /= Math.pow(kz, .6); KJ /= Math.pow(kz, .6);
      if (left) mirror(bx, drawBoy); else drawBoy();
      ctx.restore(); KW = Math.pow(1 / z, .78); KJ = Math.pow(1 / z, .85);
    } else if (left) mirror(bx, drawBoy); else drawBoy();
    if (e >= 16 && e < 19){ hand('!', bx + 50, G - 96, 26, {bold: true}); }

    // other children rolling their own hoops through the lit streets
    if (e >= 112){
      var kids = [[-520, 1], [640, -1], [980, 1], [-300, -1]];
      for (k = 0; k < kids.length; k++){
        var kx = kids[k][0] + kids[k][1] * (e - 112) * 7, sc2 = 1.5;
        ctx.save(); ctx.translate(kx, G); ctx.scale(sc2 * kids[k][1], sc2); ctx.translate(-kx, -G); KW /= 1.6; KJ /= 1.6;
        var hb = boy(kx, kx / 12 + k, true, null, false, false, 0); hoop(kx + 58, 28, kx / 28); line(hb.hx - 6, hb.hy + 3, kx + 58 - 24, G - 42, {w: 1.6, jit: .4});
        ctx.restore(); KW = Math.pow(1 / z, .78); KJ = Math.pow(1 / z, .85);
      }
    }
    ctx.restore(); KW = 1; KJ = 1;

    if (e >= 132) hand('stand by me'.slice(0, e - 131), W / 2 + 8, H - 32, 36, {bold: true});
    if (e >= 146) hand('un sol por cada edificio', W / 2 + 8, H - 12, 17, {a: .7 * clamp((e - 145) / 3, 0, 1)});
    hand(String(e - 5), 44, H - 12, 15, {a: .5, align: 'left'});
  }

  function draw(){
    var rect = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    var pw = Math.max(240, Math.round(rect.width * dpr)), ph = Math.round(pw * H / W);
    if (cv.width !== pw || cv.height !== ph){ cv.width = pw; cv.height = ph; }
    ctx.setTransform(pw / W, 0, 0, ph / H, 0, 0);
    R = rng(frame * 7919 + 13);
    if (frame < 6) cover(frame); else page(frame);
  }

  // ---------- controls ----------
  function setFrame(n, quiet){
    n = clamp(Math.round(n), 0, TOTAL - 1);
    if (n === frame && !quiet) return;
    frame = n; draw();
    bar.value = n; sceneEl.textContent = sceneName(n); countEl.textContent = 'hoja ' + (n + 1) + ' de ' + TOTAL;
    if (!quiet){
      sheen.classList.remove('go'); void sheen.offsetWidth; sheen.classList.add('go');
      thumb.classList.add('tick'); clearTimeout(setFrame._t); setFrame._t = setTimeout(function(){ thumb.classList.remove('tick'); }, 70);
    }
  }
  function stop(){ if (timer){ clearInterval(timer); timer = null; } playBtn.textContent = frame >= TOTAL - 1 ? 'Ver otra vez' : 'Pasar las hojas'; }
  function play(){
    if (timer){ stop(); return; }
    if (frame >= TOTAL - 1) setFrame(0);
    playBtn.textContent = 'Parar';
    timer = setInterval(function(){ if (frame >= TOTAL - 1){ stop(); return; } setFrame(frame + 1); }, 120);
  }
  playBtn.addEventListener('click', play);
  resetBtn.addEventListener('click', function(){ stop(); setFrame(0); playBtn.textContent = 'Pasar las hojas'; });
  bar.addEventListener('input', function(){ stop(); setFrame(+bar.value); });

  var drag = null;
  book.addEventListener('pointerdown', function(e){ stop(); drag = {x: e.clientX, y: e.clientY, f: frame}; try{ book.setPointerCapture(e.pointerId); }catch(_){} });
  book.addEventListener('pointermove', function(e){ if (!drag) return; var d = (drag.y - e.clientY) + (drag.x - e.clientX); setFrame(drag.f + d / 7); });
  function end(){ drag = null; }
  book.addEventListener('pointerup', end); book.addEventListener('pointercancel', end);

  var acc = 0;
  window.addEventListener('wheel', function(e){
    e.preventDefault(); stop(); acc += e.deltaY;
    var steps = (acc / 26) | 0; if (steps){ acc -= steps * 26; setFrame(frame + steps); }
  }, {passive: false});
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ stop(); setFrame(frame + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ stop(); setFrame(frame - 1); }
  });
  window.addEventListener('resize', draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  window.__setFrame = function(n){ setFrame(n, true); };
  setFrame(0, true);
})();
